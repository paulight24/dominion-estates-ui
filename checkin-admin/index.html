<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Guest Codes · Dominion Estates</title>
<link rel="stylesheet" href="./admin.css" />
</head>
<body>
<div class="wrap">

  <div id="login-view">
    <h1>Dominion Estates</h1>
    <p class="sub">Check-in code management — sign in to continue</p>
    <form class="card" id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <div class="err" id="login-err"></div>
      <button class="btn-primary" type="submit" id="login-btn">Sign in</button>
    </form>
  </div>

  <div id="admin-view" class="hidden">
    <div class="topbar">
      <div>
        <h1>Guest Codes</h1>
        <p class="sub">Create and revoke check-in codes</p>
      </div>
      <div style="text-align:right">
        <div class="who" id="who"></div>
        <button class="btn-ghost" id="logout-btn" style="margin-top:6px;padding:6px 12px;font-size:.82rem">Sign out</button>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>

    <div class="card">
      <label for="property-select">Property</label>
      <select id="property-select"></select>
      <p class="muted" id="guide-link-note"></p>
    </div>

    <div class="card">
      <h2>Send a new code</h2>
      <label for="new-guest-name">Guest first name <span class="hint">used in the message below</span></label>
      <input id="new-guest-name" placeholder="e.g. Sarah" />
      <div class="row">
        <div>
          <label for="new-code">4-digit code</label>
          <input id="new-code" inputmode="numeric" maxlength="4" placeholder="e.g. last 4 of their phone" />
        </div>
        <div>
          <label for="new-expiry">Expires</label>
          <input id="new-expiry" type="date" />
        </div>
      </div>
      <label for="new-label">Label <span class="hint">for you only — the guest never sees this</span></label>
      <input id="new-label" placeholder="e.g. Smith · Aug 2–9" />
      <div style="margin-bottom:16px">
        <button class="btn-ghost" id="suggest-code-btn" type="button">Suggest random code</button>
      </div>
      <div class="err" id="add-code-err"></div>
      <button class="btn-primary" id="add-code-btn" type="button">Generate &amp; save code</button>

      <div class="result hidden" id="result">
        <strong>Ready to send:</strong>
        <pre id="result-text"></pre>
        <button class="btn-ghost" id="copy-result-btn" type="button">Copy message</button>
      </div>
    </div>

    <div class="card">
      <h2>Active &amp; recent codes</h2>
      <div id="codes-list" class="list"><p class="muted">Loading…</p></div>
    </div>
  </div>

</div>

<script type="module">
import {
  db, $, showError, friendlyError, fmtDate, startAdmin, auth, GUIDE_BASE_URL,
} from './admin-common.js';
import {
  doc, getDoc, setDoc, updateDoc, collection, getDocs, Timestamp, serverTimestamp,
} from '../vendor/firebase/firebase-firestore-lite.js';

let properties = {}; // slug -> { name, contentKeyB64 }

startAdmin({ page: 'codes', onReady: init });

async function init() {
  $('new-expiry').value = defaultExpiry();
  $('property-select').addEventListener('change', (e) => {
    if (e.target.value) selectProperty(e.target.value);
  });
  $('suggest-code-btn').addEventListener('click', () => {
    $('new-code').value = String(Math.floor(1000 + Math.random() * 9000));
  });
  $('add-code-btn').addEventListener('click', addCode);
  $('copy-result-btn').addEventListener('click', () => {
    navigator.clipboard.writeText($('result-text').textContent);
    $('copy-result-btn').textContent = 'Copied ✓';
    setTimeout(() => { $('copy-result-btn').textContent = 'Copy message'; }, 1500);
  });
  await loadProperties();
}

async function loadProperties() {
  const sel = $('property-select');
  try {
    const snap = await getDocs(collection(db, 'properties'));
    properties = {};
    snap.forEach((d) => { properties[d.id] = d.data(); });
  } catch (e) {
    showError($('add-code-err'), friendlyError(e));
    return;
  }

  const slugs = Object.keys(properties).sort();
  sel.innerHTML = '';
  if (!slugs.length) {
    sel.innerHTML = '<option value="">No properties yet — add one on the Properties tab</option>';
    $('codes-list').innerHTML = '<p class="muted">No properties registered yet.</p>';
    $('guide-link-note').textContent = '';
    return;
  }
  for (const slug of slugs) {
    const opt = document.createElement('option');
    opt.value = slug;
    opt.textContent = properties[slug].name || slug;
    sel.appendChild(opt);
  }
  await selectProperty(slugs[0]);
}

async function selectProperty(slug) {
  $('guide-link-note').textContent = `Guest link: ${GUIDE_BASE_URL}${slug}/`;
  await loadCodes(slug);
}

async function loadCodes(slug) {
  const list = $('codes-list');
  list.innerHTML = '<p class="muted">Loading…</p>';
  const codes = [];
  try {
    const snap = await getDocs(collection(db, 'properties', slug, 'codes'));
    snap.forEach((d) => codes.push({ id: d.id, ...d.data() }));
  } catch (e) {
    list.innerHTML = '';
    const p = document.createElement('p');
    p.className = 'muted';
    p.textContent = friendlyError(e);
    list.appendChild(p);
    return;
  }
  codes.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

  if (!codes.length) {
    list.innerHTML = '<p class="muted">No codes yet for this property.</p>';
    return;
  }
  list.innerHTML = '';
  const now = new Date();
  for (const c of codes) {
    const expires = c.expiresAt?.toDate ? c.expiresAt.toDate() : null;
    const dead = !c.active || (expires && expires < now);

    const item = document.createElement('div');
    item.className = 'list-item';

    const row = document.createElement('div');
    row.className = 'list-row' + (dead ? ' dim' : '');
    row.innerHTML = `
      <span class="code-val"></span>
      <span class="list-meta">
        ${c.label ? '<span class="label"></span>' : ''}
        Expires ${fmtDate(c.expiresAt)}
      </span>
      <span class="badge ${dead ? 'off' : ''}">${dead ? (c.active ? 'Expired' : 'Revoked') : 'Active'}</span>
      <button class="btn-ghost" data-view-message style="padding:7px 12px;font-size:.82rem">View message</button>
      ${dead ? '' : '<button class="btn-danger" data-revoke>Revoke</button>'}
    `;
    // Code and label are set as text, never HTML — a guest name should
    // never be able to inject markup into this list.
    row.querySelector('.code-val').textContent = c.id;
    if (c.label) row.querySelector('.label').textContent = c.label;
    item.appendChild(row);

    const panel = document.createElement('div');
    panel.className = 'result hidden';
    panel.style.marginTop = '0';
    panel.innerHTML = `<pre></pre><button class="btn-ghost" data-copy-message type="button">Copy message</button>`;
    panel.querySelector('pre').textContent = buildGuestMessage(c.guestName, slug, c.id);
    item.appendChild(panel);

    row.querySelector('[data-view-message]').addEventListener('click', (e) => {
      panel.classList.toggle('hidden');
      e.target.textContent = panel.classList.contains('hidden') ? 'View message' : 'Hide message';
    });
    panel.querySelector('[data-copy-message]').addEventListener('click', (e) => {
      navigator.clipboard.writeText(panel.querySelector('pre').textContent);
      e.target.textContent = 'Copied ✓';
      setTimeout(() => { e.target.textContent = 'Copy message'; }, 1500);
    });

    if (!dead) {
      row.querySelector('[data-revoke]').addEventListener('click', () => {
        // Inline confirm, not window.confirm() — a native dialog's "don't
        // ask again" checkbox can silently disable future confirmations.
        row.innerHTML = `
          <span class="list-meta"><span class="label" style="color:var(--danger)">Revoke code ${c.id}? The guest's link stops working immediately.</span></span>
          <button class="btn-ghost" data-cancel style="padding:7px 12px;font-size:.82rem">Cancel</button>
          <button class="btn-danger" data-confirm-revoke>Yes, revoke</button>
        `;
        row.querySelector('[data-cancel]').addEventListener('click', () => loadCodes(slug));
        row.querySelector('[data-confirm-revoke]').addEventListener('click', async (e) => {
          e.target.disabled = true; e.target.textContent = 'Revoking…';
          try {
            await updateDoc(doc(db, 'properties', slug, 'codes', c.id), { active: false });
          } catch (err) {
            alert(friendlyError(err));
          }
          loadCodes(slug);
        });
      });
    }
    list.appendChild(item);
  }
}

function defaultExpiry() {
  const d = new Date();
  d.setMonth(d.getMonth() + 1);
  return d.toISOString().slice(0, 10);
}

function buildGuestMessage(guestName, slug, code) {
  const name = guestName || 'Guest';
  return `Dear ${name},

Here is your personalized check-in guide for your upcoming stay.

Check-in Guide:
${GUIDE_BASE_URL}${slug}/

Passcode: ${code}

The guide includes everything you'll need for a smooth arrival, including check-in instructions, parking information, WiFi details, and helpful information about the property and surrounding area.

Please note: Your door and gate access code will be sent separately before check-in.

If you have any questions before your arrival, please don't hesitate to reach out. We look forward to hosting you!

Warm regards,
Dominion team`;
}

async function addCode() {
  const err = $('add-code-err');
  err.classList.remove('show');
  $('result').classList.add('hidden');

  const slug = $('property-select').value;
  const code = $('new-code').value.trim();
  const expiryStr = $('new-expiry').value;
  const label = $('new-label').value.trim();
  const guestName = $('new-guest-name').value.trim();

  if (!slug) return showError(err, 'Add a property on the Properties tab first.');
  if (!/^\d{4}$/.test(code)) return showError(err, 'Code must be exactly 4 digits.');
  if (!expiryStr) return showError(err, 'Pick an expiry date.');
  const expiryDate = new Date(expiryStr + 'T23:59:59');
  if (expiryDate <= new Date()) return showError(err, 'Expiry must be in the future.');

  const contentKeyB64 = properties[slug]?.contentKeyB64;
  if (!contentKeyB64) return showError(err, 'This property has no content key on file — re-check it on the Properties tab.');

  const btn = $('add-code-btn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const existing = await getDoc(doc(db, 'properties', slug, 'codes', code));
    if (existing.exists() && existing.data().active && existing.data().expiresAt?.toDate() > new Date()) {
      if (!confirm(`Code ${code} is already active for this property. Replace it?`)) {
        btn.disabled = false; btn.textContent = 'Generate & save code';
        return;
      }
    }
    await setDoc(doc(db, 'properties', slug, 'codes', code), {
      active: true,
      label: label || null,
      guestName: guestName || null,
      expiresAt: Timestamp.fromDate(expiryDate),
      contentKeyB64,
      createdAt: serverTimestamp(),
      createdBy: auth.currentUser.email,
    });
  } catch (e) {
    showError(err, friendlyError(e));
    btn.disabled = false; btn.textContent = 'Generate & save code';
    return;
  }
  btn.disabled = false; btn.textContent = 'Generate & save code';

  $('result-text').textContent = buildGuestMessage(guestName, slug, code);
  $('result').classList.remove('hidden');
  $('new-code').value = ''; $('new-label').value = ''; $('new-guest-name').value = ''; $('new-expiry').value = defaultExpiry();
  await loadCodes(slug);
}
</script>
</body>
</html>
