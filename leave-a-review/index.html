<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leave a Review | Dominion Estates</title>
<meta name="description" content="Stayed with us? We'd love to hear about it — leave a review of your Newport Beach furnished rental experience." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://dominionestatesrentals.com/leave-a-review/" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500..800;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0A1931; --gold:#C5A880; --gold-dk:#B8975F; --beige:#F8F5F0; --cream:#FDFBF7;
    --white:#fff; --ink:#1A1D20; --muted:#64748B; --border:#e7e1d6; --shadow:0 10px 40px rgba(10,25,49,.10);
    --serif:'Playfair Display',Georgia,serif; --sans:'Plus Jakarta Sans',system-ui,sans-serif; --danger:#b4232a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);color:var(--ink);background:var(--beige);-webkit-font-smoothing:antialiased;line-height:1.6}

  .hero{background:radial-gradient(900px 500px at 50% -30%, #163158 0%, var(--navy) 60%, #06101f 100%);color:#fff;padding:60px 24px 70px;text-align:center}
  .hero-inner{max-width:640px;margin:0 auto}
  .eyebrow{display:inline-block;margin-bottom:14px;font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
  .hero h1{font-family:var(--serif);font-size:2.3rem;line-height:1.15;font-weight:700}
  .hero p{margin:16px auto 0;max-width:520px;color:#cdd6e4;font-size:1rem;font-weight:300}

  .wrap{max-width:560px;margin:-40px auto 0;padding:0 20px 80px}
  .card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:34px 30px;box-shadow:var(--shadow)}

  label{display:block;font-size:.78rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold-dk);margin-bottom:7px}
  .hint{font-size:.82rem;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;margin-top:-3px;margin-bottom:7px}
  input[type="text"], input[type="email"], textarea{
    width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:1rem;
    font-family:inherit;margin-bottom:20px;background:var(--cream);color:var(--ink)
  }
  input:focus, textarea:focus{outline:none;border-color:var(--gold)}
  textarea{resize:vertical;min-height:120px}
  .row{display:flex;gap:14px}
  .row > *{flex:1}

  .stars{display:flex;gap:8px;margin-bottom:22px}
  .star-btn{background:none;border:none;font-size:2rem;line-height:1;cursor:pointer;color:var(--border);padding:0;transition:.12s}
  .star-btn.on{color:var(--gold)}
  .star-btn:hover{color:var(--gold-dk)}

  .btn-primary{width:100%;padding:15px;border:none;border-radius:12px;background:var(--navy);color:#fff;
    font-family:inherit;font-size:.98rem;font-weight:600;cursor:pointer;transition:.2s}
  .btn-primary:hover{background:#12294c}
  .btn-primary:disabled{opacity:.55;cursor:default}
  .err{color:var(--danger);font-size:.86rem;margin:-10px 0 16px;display:none}
  .err.show{display:block}

  .thanks{text-align:center;padding:20px 0}
  .thanks h2{font-family:var(--serif);font-size:1.7rem;color:var(--navy);margin-bottom:10px}
  .thanks p{color:var(--muted)}
  .hidden{display:none !important}

  .foot{text-align:center;margin-top:22px}
  .foot a{color:var(--muted);font-size:.88rem;text-decoration:none}
  .foot a:hover{color:var(--gold-dk)}
</style>
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <span class="eyebrow">Dominion Estates</span>
      <h1>How Was Your Stay?</h1>
      <p>We'd love to hear about your experience — it helps future guests, and it helps us too.</p>
    </div>
  </header>

  <div class="wrap">
    <div class="card">
      <form id="review-form">
        <div class="row">
          <div>
            <label for="first-name">First name</label>
            <input type="text" id="first-name" required maxlength="60" />
          </div>
          <div>
            <label for="last-name">Last name <span class="hint" style="display:inline">(optional)</span></label>
            <input type="text" id="last-name" maxlength="60" />
          </div>
        </div>

        <label for="email">Email <span class="hint" style="display:inline">(optional — kept private, never published)</span></label>
        <input type="email" id="email" maxlength="120" />

        <label>Rating</label>
        <div class="stars" id="stars" role="radiogroup" aria-label="Star rating">
          <button type="button" class="star-btn" data-star="1" aria-label="1 star">★</button>
          <button type="button" class="star-btn" data-star="2" aria-label="2 stars">★</button>
          <button type="button" class="star-btn" data-star="3" aria-label="3 stars">★</button>
          <button type="button" class="star-btn" data-star="4" aria-label="4 stars">★</button>
          <button type="button" class="star-btn" data-star="5" aria-label="5 stars">★</button>
        </div>

        <label for="review-text">Your review</label>
        <textarea id="review-text" required maxlength="2000" placeholder="Tell us about your stay..."></textarea>

        <div class="err" id="form-err"></div>
        <button class="btn-primary" type="submit" id="submit-btn">Submit review</button>
      </form>

      <div class="thanks hidden" id="thanks">
        <h2>Thank you!</h2>
        <p>Your review has been submitted and will appear on our site soon after a quick review.</p>
      </div>
    </div>

    <div class="foot"><a href="/">← Back to Dominion Estates</a></div>
  </div>

<script type="module">
import { initializeApp } from '../vendor/firebase/firebase-app.js';
import { getFirestore, collection, addDoc, serverTimestamp } from '../vendor/firebase/firebase-firestore-lite.js';
import { FIREBASE_CONFIG } from '../checkin/firebase-config.js';

const app = initializeApp(FIREBASE_CONFIG);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
let rating = 5;

const starButtons = Array.from(document.querySelectorAll('.star-btn'));
function paintStars() {
  starButtons.forEach((btn) => {
    btn.classList.toggle('on', Number(btn.dataset.star) <= rating);
  });
}
starButtons.forEach((btn) => {
  btn.addEventListener('click', () => {
    rating = Number(btn.dataset.star);
    paintStars();
  });
});
paintStars();

$('review-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('form-err');
  err.classList.remove('show');

  const firstName = $('first-name').value.trim();
  const lastName = $('last-name').value.trim();
  const email = $('email').value.trim();
  const reviewText = $('review-text').value.trim();

  if (!firstName) { err.textContent = 'Please enter your first name.'; err.classList.add('show'); return; }
  if (!reviewText) { err.textContent = 'Please write a short review.'; err.classList.add('show'); return; }

  const btn = $('submit-btn');
  btn.disabled = true; btn.textContent = 'Submitting…';
  try {
    const data = { firstName, rating, reviewText, status: 'pending', createdAt: serverTimestamp() };
    if (lastName) data.lastName = lastName;
    if (email) data.email = email;
    await addDoc(collection(db, 'reviews'), data);
  } catch (e2) {
    err.textContent = "Something went wrong submitting your review — please try again in a moment.";
    err.classList.add('show');
    btn.disabled = false; btn.textContent = 'Submit review';
    return;
  }
  $('review-form').classList.add('hidden');
  $('thanks').classList.remove('hidden');
});
</script>
</body>
</html>
